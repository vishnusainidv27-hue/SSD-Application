name: admin_mobile_app
description: SSD Farm - Admin mobile app (Android & iOS).
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  ssd_shared:
    path: ../../shared/ssd_shared
  share_plus: ^13.3.0
  google_maps_flutter: ^2.18.1
  intl: ^0.19.0
  table_calendar: ^3.1.3
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon_foreground.png

# Placeholder branding (a plain milk-drop glyph in the app's own brand color,
# see docs/PROJECT_STATUS.md Phase 8) — swap assets/icon/*.png for the real
# logo when ready, then re-run `dart run flutter_launcher_icons` and
# `dart run flutter_native_splash:create`. No code changes needed either way.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1F3864"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon_foreground.png
  color_dark: "#1F3864"
  image_dark: assets/icon/app_icon_foreground.png
  android_12:
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/icon/app_icon_foreground.png
    icon_background_color_dark: "#1F3864"
